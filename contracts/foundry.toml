[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "../packages/shared/src/deployments" },
]

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
